<!DOCTYPE html>
<html>
<head><title>QR Generator Test</title></head>
<body>
<h1>QR Code Generator Tests</h1>
<div id="results"></div>
<h2>QR Output</h2>
<div id="qr-output"></div>
<script src="qr.js"></script>
<script>
var results = document.getElementById('results');
function pass(msg) { var d = document.createElement('div'); d.style.color = 'green'; d.textContent = 'PASS: ' + msg; results.appendChild(d); }
function fail(msg) { var d = document.createElement('div'); d.style.color = 'red'; d.textContent = 'FAIL: ' + msg; results.appendChild(d); }

function assert(cond, msg) { cond ? pass(msg) : fail(msg); }

// Test 1: generate returns a string
var svg = QR.generate('otpauth://totp/test:user?secret=JBSWY3DPEHPK3PXP&issuer=test&algorithm=SHA1&digits=6&period=30', 200);
assert(svg !== null && typeof svg === 'string', 'QR.generate returns non-null string');

// Test 2: SVG has valid structure
assert(svg.indexOf('<svg') === 0, 'SVG starts with <svg');
assert(svg.indexOf('</svg>') === svg.length - 7, 'SVG ends with </svg>');

// Test 3: SVG has rect modules (not just the URI inside svg tags)
assert(svg.indexOf('<rect') !== -1, 'SVG contains <rect> module elements');

// Test 4: SVG has multiple modules
var rectCount = (svg.match(/<rect/g) || []).length;
assert(rectCount > 50, 'SVG has >50 rect modules (found ' + rectCount + ')');

// Test 5: SVG does NOT contain the raw URI inside svg tags (URI should be encoded, not literal)
var svgWithoutRects = svg.replace(/<rect[^>]*\/>/g, '');
var svgWithoutAttrs = svgWithoutRects.replace(/<rect[^\/>]*>/g, '');
assert(svgWithoutAttrs.indexOf('otpauth') === -1, 'SVG body does not contain raw URI text');

// Test 6: SVG has viewBox
assert(svg.indexOf('viewBox="0 0 200 200"') !== -1, 'SVG has viewBox matching size');

// Test 7: Different input produces different output
var svg2 = QR.generate('otpauth://totp/test:user2?secret=KBSWY3DPEHPK3PXP&issuer=test&algorithm=SHA1&digits=6&period=30', 200);
assert(svg !== svg2, 'Different inputs produce different SVGs');

// Test 8: Same input produces same output (deterministic)
var svg3 = QR.generate('otpauth://totp/test:user?secret=JBSWY3DPEHPK3PXP&issuer=test&algorithm=SHA1&digits=6&period=30', 200);
assert(svg === svg3, 'Same input produces identical SVG (deterministic)');

// Test 9: Null input returns null
assert(QR.generate('') === null, 'Empty string returns null');
assert(QR.generate(null) === null, 'Null input returns null');

// Test 10: Size parameter works
var svgSmall = QR.generate('otpauth://totp/test:u?secret=ABC&issuer=test&algorithm=SHA1&digits=6&period=30', 100);
assert(svgSmall.indexOf('viewBox="0 0 100 100"') !== -1, 'Size 100 produces viewBox 100x100');

// Test 11: Long URI (version 4+)
var longUri = 'otpauth://totp/test:user@example.com?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=TestApp&algorithm=SHA1&digits=6&period=30';
var svgLong = QR.generate(longUri, 200);
assert(svgLong !== null && svgLong.indexOf('<rect') !== -1, 'Long URI generates valid QR (' + longUri.length + ' chars)');

// Render QR for visual verification
document.getElementById('qr-output').innerHTML = svg;
</script>
</body>
</html>
